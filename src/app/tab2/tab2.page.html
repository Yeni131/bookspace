<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi Biblioteca</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Biblioteca</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="ion-padding">
    <h2>Mis Lecturas</h2>
    <p>Organiza tus libros y lleva un registro de tus lecturas.</p>
    <ion-segment value="quiero-leer">
    <ion-segment-button values="quiero-leer">
      <ion-label>Quiero leer</ion-label>
    </ion-segment-button>
    <ion-segment-button values="leyendo">
      <ion-label>Leyendo</ion-label>
    </ion-segment-button>
    <ion-segment-button values="leidos">
      <ion-label>Leidos</ion-label>
    </ion-segment-button>
    </ion-segment>
  </div>
</ion-content>
