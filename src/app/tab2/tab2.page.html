<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi Biblioteca</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Biblioteca</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="ion-padding">
    <h2>Mis Lecturas</h2>
    <p>Organiza tus libros y lleva un registro de tus lecturas.</p>
  <ion-segment
    [(ngModel)]="categoriaSeleccionada">
   <ion-segment-button value="quiero-leer">
      <ion-label>Quiero leer</ion-label>
     </ion-segment-button>
   <ion-segment-button value="leyendo">
    <ion-label>Leyendo</ion-label>
   </ion-segment-button>
   <ion-segment-button value="leidos">
      <ion-label>Leídos</ion-label>
    </ion-segment-button>
  </ion-segment>
<div class="ion-padding ion-text-center" *ngIf="obtenerLibrosPorCategoria().length === 0">
  <p>Todavía no tenés libros en esta categoría.</p>
</div>
<ion-grid>
  <ion-row>
    <ion-col size="6" size-md="4" size-lg="3" *ngFor="let libro of obtenerLibrosPorCategoria()">
      <ion-card button="true"(click)="verDetalle(libro)">
        <ion-img
          [src]="libro.portada"
          [alt]="libro.titulo">
        </ion-img>
        <ion-card-content>
          <h2>{{ libro.titulo }}</h2>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-grid>
  </div>
</ion-content>
