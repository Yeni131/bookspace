<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/tabs/tab1">
      </ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del libro</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <div class="estado" *ngIf="cargando">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando información...</p>
  </div>
  <div class="estado" *ngIf="mensajeError">
    <p>{{ mensajeError }}</p>
  </div>
  <div *ngIf="libro && !cargando">
    <div class="portada">
      <ion-img [src]="obtenerPortada()"></ion-img>
    </div>
    <h1>{{ libro.title }}</h1>
    <p class="fecha">
      Primera publicación: {{ obtenerAnio() }}
    </p>
    <h2>Sinopsis</h2>
    <p class="descripcion">
      {{ obtenerDescripcion() }}
    </p>
  </div>
</ion-content>
