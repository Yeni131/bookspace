<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Explorar Libros </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Explorar Libros</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    <ion-item *ngFor="let libro of libros">
      <ion-label>
        <h2>{{ libro.title }}</h2>
        <p>{{ libro.author_name?.[0] || 'Autor desconocido' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
