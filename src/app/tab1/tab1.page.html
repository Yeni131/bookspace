<ion-header>
  <ion-toolbar>
    <ion-title>Explorar Libros</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
<ion-searchbar
  placeholder="Buscar libros por título..."
  [debounce]="500"
  (ionInput)="buscarLibros($event)">
</ion-searchbar>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let libro of libros">
        <ion-card>
          <ion-img
            [src]="obtenerPortada(libro)"
            [alt]="libro.title">
          </ion-img>
          <ion-card-content>
            <h2>{{ libro.title }}</h2>
            <p>
              {{ libro.author_name?.[0] || 'Autor desconocido' }}
            </p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
