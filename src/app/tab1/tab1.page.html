<ion-header>
  <ion-toolbar>
    <ion-title>Explorar Libros</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
<ion-searchbar
  placeholder="Buscar libros por título..."
  [debounce]="500"
  (ionInput)="buscarLibros($event)">
</ion-searchbar>
<div class="estado" *ngIf="cargando">
  <ion-spinner name="crescent"></ion-spinner>
  <p>Cargando libros...</p>
</div>
<div class="estado" *ngIf="mensajeError">
  <p>{{ mensajeError }}</p>
</div>
<div class="estado"
     *ngIf="!cargando && !mensajeError && libros.length === 0">
  <p>No se encontraron libros.</p>
</div>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let libro of libros">
        <ion-card  button="true" (click)="verDetalle(libro)">
          <ion-img
            [src]="obtenerPortada(libro)"
            [alt]="libro.title">
          </ion-img>
          <ion-card-content>
            <h2>{{ libro.title }}</h2>
            <p>
              {{ libro.author_name?.[0] || 'Autor desconocido' }}
            </p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
